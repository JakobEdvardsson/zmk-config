CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_POINTING=y
# Improve the link quality between the two halves.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Host-facing BLE security settings live in skeletyl_left.conf; enabling
# passkey entry here would interfere with automatic split pairing.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=7
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

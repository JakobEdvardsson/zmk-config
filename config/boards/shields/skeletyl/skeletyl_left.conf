CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_POINTING=y
# Linux hosts can otherwise fail LE Secure Connections pairing with the default
# settings ("unexpected SMP command 0x0b") and then connect/disconnect in a loop.
# This disables 2M PHY and enables passkey entry with bond overwrite.
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Report the peripheral (right) half's battery level to the host as well.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=7
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7
